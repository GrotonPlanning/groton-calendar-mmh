<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Community Events Calendar</title>
  <style>
    body {
      font-family: Helvetica, Arial, sans-serif;
      color: #003366;
      margin: 0;
      padding: 20px;
      background: #f9f9f9;
    }
    h2 { text-align: center; font-weight: 600; margin-bottom: 10px; }
    #calendar-nav { text-align: center; margin-bottom: 15px; }
    #calendar-nav button {
      background: #003366; color: white; border: none; padding: 6px 12px;
      margin: 0 5px; border-radius: 4px; cursor: pointer; font-size: 14px;
    }
    #monthLabel { font-weight: 600; font-size: 16px; }
    #calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      max-width: 700px;
      margin: 0 auto;
      padding: 10px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .day {
      border: 1px solid #ccc;
      border-radius: 6px;
      min-height: 80px;
      position: relative;
      text-align: right;
      padding: 5px;
      background-color: #fff;
      transition: all 0.2s ease;
    }
    .day:hover { box-shadow: 0 0 8px rgba(0,0,0,0.2); cursor: pointer; }
    .day.has-event { background-color: #e8f0ff; border-color: #0055a5; font-weight: 600; }
    .day-number { font-size: 14px; }
    .tooltip {
      display: none; position: absolute; z-index: 10; top: 100%; left: 50%;
      transform: translateX(-50%); width: 260px; background: white; color: #003366;
      border: 1px solid #ccc; border-radius: 8px; padding: 10px; text-align: left;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .day:hover .tooltip { display: block; }
    .calendar-day-label { text-align: center; font-weight: 500; color: #666; }
    /* responsive */
    @media (max-width:700px){
      #calendar { max-width: 100%; grid-template-columns: repeat(7, minmax(0,1fr)); }
      .tooltip { left: 5%; transform: translateX(0); width: 90%; }
    }
  </style>
</head>
<body>

<div id="calendar-container">
  <h2>Community Events Calendar</h2>
  <div id="calendar-nav">
    <button id="prevMonth">&#8592; Prev</button>
    <span id="monthLabel" aria-live="polite"></span>
    <button id="nextMonth">Next &#8594;</button>
  </div>
  <div id="calendar" role="grid" aria-label="Events calendar"></div>
</div>

<script>
/* ===========================
   🗓️ UPDATE EVENTS HERE
   - Edit the array below to add/remove events.
   - Date format must be YYYY-MM-DD
   - Only you edit this file in the repo; public viewers cannot edit the iframe.
*/
const events = [
  {
    date: '2025-11-02',
    title: 'Community Open House',
    time: '10:00 AM – 1:00 PM',
    loc: 'Groton Senior Center',
    desc: 'Learn about Missing Middle Housing and share feedback.'
  },
  {
    date: '2025-11-15',
    title: 'Focus Group: Developers & Lenders',
    time: '2:00 PM – 4:00 PM',
    loc: 'Town Hall Annex, Room 201',
    desc: 'Small-group discussion about housing feasibility and financing.'
  },
  {
    date: '2025-12-03',
    title: 'Planning Commission Briefing',
    time: '6:30 PM',
    loc: 'Town Hall Chambers',
    desc: 'Staff presentation and discussion on housing study findings.'
  }
];

let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();

const calendar = document.getElementById('calendar');
const monthLabel = document.getElementById('monthLabel');
const prevBtn = document.getElementById('prevMonth');
const nextBtn = document.getElementById('nextMonth');
const dayLabels = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function renderCalendar(month, year){
  calendar.innerHTML = '';
  // weekday headers
  dayLabels.forEach(label=>{
    const d = document.createElement('div');
    d.className = 'calendar-day-label';
    d.textContent = label;
    calendar.appendChild(d);
  });

  const firstDay = new Date(year, month, 1);
  const startDay = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  monthLabel.textContent = `${firstDay.toLocaleString(undefined,{month:'long'})} ${year}`;

  for(let i=0;i<startDay;i++) calendar.appendChild(document.createElement('div'));

  for(let day=1; day<=daysInMonth; day++){
    const cell = document.createElement('div');
    cell.className = 'day';
    cell.setAttribute('role','gridcell');
    const dn = document.createElement('div');
    dn.className = 'day-number';
    dn.textContent = day;
    cell.appendChild(dn);

    const y = year;
    const m = String(month+1).padStart(2,'0');
    const d = String(day).padStart(2,'0');
    const dateString = `${y}-${m}-${d}`;

    // find all events on date (allow multiple events per day)
    const dayEvents = events.filter(e => e.date === dateString);
    if(dayEvents.length){
      cell.classList.add('has-event');

      // Create tooltip listing all events for the day
      const tooltip = document.createElement('div');
      tooltip.className = 'tooltip';
      dayEvents.forEach(ev=>{
        tooltip.innerHTML += `<strong>${ev.title}</strong><br>${ev.time ? ev.time + '<br>' : ''}${ev.loc ? ev.loc + '<br>' : ''}${ev.desc ? '<small>' + ev.desc + '</small><br><hr style="border:none;border-top:1px solid #eee;margin:6px 0;">' : ''}`;
      });
      // remove last hr
      tooltip.innerHTML = tooltip.innerHTML.replace(/<hr style="[^"]*">$/, '');
      cell.appendChild(tooltip);
    }

    calendar.appendChild(cell);
  }
}

// navigation
prevBtn.addEventListener('click', ()=>{
  currentMonth--;
  if(currentMonth < 0){ currentMonth = 11; currentYear--; }
  renderCalendar(currentMonth,currentYear);
});
nextBtn.addEventListener('click', ()=>{
  currentMonth++;
  if(currentMonth > 11){ currentMonth = 0; currentYear++; }
  renderCalendar(currentMonth,currentYear);
});

// initial render
renderCalendar(currentMonth,currentYear);
</script>

</body>
</html>
